<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Skill - CertiFolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/custom.css}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark py-2 shadow-sm no-print">
        <div class="container-fluid px-lg-4">
            <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/}">
                <i class="fa-solid fa-graduation-cap text-primary fs-4"></i>
                <span class="fs-4 fw-bold text-white">Certi<span class="text-primary">Folio</span></span>
            </a>
        </div>
    </nav>

    <main class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="card border-0 shadow-sm rounded-4 bg-white">
                    <div class="card-header bg-white border-0 pt-4 px-4">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h4 class="fw-bold mb-1">Add Technical Skill</h4>
                                <p class="text-muted small mb-0">Record a skill proficiency for a student.</p>
                            </div>
                            <a th:href="@{/skills}" class="btn btn-outline-secondary btn-sm"><i class="fa-solid fa-arrow-left me-1"></i> Back</a>
                        </div>
                    </div>
                    <div class="card-body px-4 py-3">
                        <form th:action="@{/skills/save}" th:object="${skillDto}" method="post">
                            <input type="hidden" th:field="*{id}">

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Select Student <span class="text-danger">*</span></label>
                                <select th:field="*{studentId}" class="form-select" required>
                                    <option value="">-- Choose Student --</option>
                                    <option th:each="st : ${students}" th:value="${st.id}" th:text="${st.fullName + ' (' + st.regNo + ')'}"></option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Skill Name <span class="text-danger">*</span></label>
                                <input type="text" th:field="*{name}" class="form-control" placeholder="e.g. Java, Docker, AWS, React, Python" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Skill Category <span class="text-danger">*</span></label>
                                <select th:field="*{category}" class="form-select" required>
                                    <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat.displayName}"></option>
                                </select>
                            </div>

                            <div class="row g-2">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-semibold">Proficiency Level</label>
                                    <select th:field="*{proficiencyLevel}" class="form-select">
                                        <option th:each="lvl : ${levels}" th:value="${lvl}" th:text="${lvl.displayName}"></option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-semibold">Rating (1 to 5 Stars)</label>
                                    <select th:field="*{rating}" class="form-select">
                                        <option value="1">1 Star - Fundamental</option>
                                        <option value="2">2 Stars - Working</option>
                                        <option value="3" selected>3 Stars - Proficient</option>
                                        <option value="4">4 Stars - Advanced</option>
                                        <option value="5">5 Stars - Expert</option>
                                    </select>
                                </div>
                            </div>

                            <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                                <a th:href="@{/skills}" class="btn btn-outline-secondary">Cancel</a>
                                <button type="submit" class="btn btn-primary px-4"><i class="fa-solid fa-plus me-1"></i> Add Skill</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
