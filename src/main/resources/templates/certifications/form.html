<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Certification - CertiFolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/custom.css}" rel="stylesheet">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark py-2 shadow-sm no-print">
        <div class="container-fluid px-lg-4">
            <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/}">
                <i class="fa-solid fa-graduation-cap text-primary fs-4"></i>
                <span class="fs-4 fw-bold text-white">Certi<span class="text-primary">Folio</span></span>
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card border-0 shadow-sm rounded-4 bg-white">
                    <div class="card-header bg-white border-0 pt-4 px-4">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h4 class="fw-bold mb-1">Submit Certification for Verification</h4>
                                <p class="text-muted small mb-0">Record a professional or academic credential into CertiFolio.</p>
                            </div>
                            <a th:href="@{/certifications}" class="btn btn-outline-secondary btn-sm"><i class="fa-solid fa-arrow-left me-1"></i> Back</a>
                        </div>
                    </div>
                    <div class="card-body px-4 py-3">
                        <form th:action="@{/certifications/save}" th:object="${certificationDto}" method="post">
                            <input type="hidden" th:field="*{id}">

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Select Student <span class="text-danger">*</span></label>
                                <select th:field="*{studentId}" class="form-select" required>
                                    <option value="">-- Choose Student --</option>
                                    <option th:each="st : ${students}" th:value="${st.id}" th:text="${st.fullName + ' (' + st.regNo + ' - ' + st.department + ')'}"></option>
                                </select>
                                <div class="text-danger small" th:if="${#fields.hasErrors('studentId')}" th:errors="*{studentId}"></div>
                            </div>

                            <div class="row g-3">
                                <div class="col-12">
                                    <label class="form-label fw-semibold">Certification Title <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{title}" class="form-control" placeholder="e.g. Google Cloud Associate Cloud Engineer" required>
                                    <div class="text-danger small" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
                                </div>

                                <div class="col-12">
                                    <label class="form-label fw-semibold">Issuing Organization / Authority <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{issuingOrganization}" class="form-control" placeholder="e.g. Google Cloud, AWS, Oracle, Coursera" required>
                                    <div class="text-danger small" th:if="${#fields.hasErrors('issuingOrganization')}" th:errors="*{issuingOrganization}"></div>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Issue Date <span class="text-danger">*</span></label>
                                    <input type="date" th:field="*{issueDate}" class="form-control" required>
                                    <div class="text-danger small" th:if="${#fields.hasErrors('issueDate')}" th:errors="*{issueDate}"></div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Expiration Date (Leave blank if lifetime)</label>
                                    <input type="date" th:field="*{expiryDate}" class="form-control">
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Credential / License ID</label>
                                    <input type="text" th:field="*{credentialId}" class="form-control" placeholder="e.g. GCP-ACE-318492">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Public Verification URL</label>
                                    <input type="url" th:field="*{credentialUrl}" class="form-control" placeholder="https://google.accredible.com/...">
                                </div>
                            </div>

                            <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                                <a th:href="@{/certifications}" class="btn btn-outline-secondary">Cancel</a>
                                <button type="submit" class="btn btn-primary px-4">
                                    <i class="fa-solid fa-cloud-arrow-up me-1"></i> Submit for Institutional Verification
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
