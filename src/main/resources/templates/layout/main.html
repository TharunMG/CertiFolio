<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CertiFolio - Student Skill &amp; Certification Portfolio Registry</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link th:href="@{/css/custom.css}" rel="stylesheet">
</head>
<body>
    <!-- Top Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark py-2 shadow-sm no-print">
        <div class="container-fluid px-lg-4">
            <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/}">
                <i class="fa-solid fa-graduation-cap text-primary fs-4"></i>
                <span class="fs-4 fw-bold text-white">Certi<span class="text-primary">Folio</span></span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCertifolio">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarCertifolio">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 fw-medium">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}"><i class="fa-solid fa-chart-line me-1"></i> Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/students}"><i class="fa-solid fa-users me-1"></i> Students</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/skills}"><i class="fa-solid fa-brain me-1"></i> Skill Matrix</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/certifications}"><i class="fa-solid fa-certificate me-1"></i> Certifications</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/audit}">
                            <i class="fa-solid fa-shield-halved me-1 text-warning"></i> Audit &amp; Verify
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/analytics}"><i class="fa-solid fa-chart-pie me-1"></i> Analytics</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center gap-2">
                    <a th:href="@{/swagger-ui.html}" target="_blank" class="btn btn-outline-info btn-sm">
                        <i class="fa-solid fa-code me-1"></i> Swagger API
                    </a>
                    <a th:href="@{/students/new}" class="btn btn-primary btn-sm">
                        <i class="fa-solid fa-user-plus me-1"></i> Register Student
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Flash Notifications Container -->
    <div class="container-fluid px-lg-4 mt-3 no-print">
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
            <i class="fa-solid fa-circle-check me-2"></i> <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
            <i class="fa-solid fa-triangle-exclamation me-2"></i> <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
    </div>

    <!-- Main Content Area -->
    <main class="container-fluid px-lg-4 py-3">
        <!-- Replaced by child template -->
    </main>

    <!-- Footer -->
    <footer class="bg-white border-top py-3 text-center text-muted no-print mt-auto">
        <div class="container-fluid">
            <small>&copy; 2026 <strong>CertiFolio</strong> &bull; Student Skill &amp; Certification Portfolio Registry &bull; Spring Boot 3 &amp; JPA</small>
        </div>
    </footer>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
</body>
</html>
