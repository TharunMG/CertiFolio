<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - CertiFolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/custom.css}" rel="stylesheet">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark py-2 shadow-sm no-print">
        <div class="container-fluid px-lg-4">
            <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/}">
                <i class="fa-solid fa-graduation-cap text-primary fs-4"></i>
                <span class="fs-4 fw-bold text-white">Certi<span class="text-primary">Folio</span></span>
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card border-0 shadow-sm rounded-4 bg-white">
                    <div class="card-header bg-white border-0 pt-4 px-4">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h4 class="fw-bold mb-1" th:text="${studentDto.id != null ? 'Edit Student Profile' : 'Register New Student'}">Register Student</h4>
                                <p class="text-muted small mb-0">Fill in academic details and portfolio links.</p>
                            </div>
                            <a th:href="@{/students}" class="btn btn-outline-secondary btn-sm"><i class="fa-solid fa-arrow-left me-1"></i> Back</a>
                        </div>
                    </div>
                    <div class="card-body px-4 py-3">
                        <form th:action="@{/students/save}" th:object="${studentDto}" method="post">
                            <input type="hidden" th:field="*{id}">

                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Registration Number <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{regNo}" class="form-control" placeholder="e.g. REG2024CS0101" required>
                                    <div class="text-danger small" th:if="${#fields.hasErrors('regNo')}" th:errors="*{regNo}"></div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Full Name <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{fullName}" class="form-control" placeholder="e.g. Aarav Sharma" required>
                                    <div class="text-danger small" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Email Address <span class="text-danger">*</span></label>
                                    <input type="email" th:field="*{email}" class="form-control" placeholder="e.g. student@institution.edu" required>
                                    <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Department <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{department}" class="form-control" placeholder="e.g. Computer Science & Engineering" required>
                                    <div class="text-danger small" th:if="${#fields.hasErrors('department')}" th:errors="*{department}"></div>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Year of Study <span class="text-danger">*</span></label>
                                    <select th:field="*{yearOfStudy}" class="form-select" required>
                                        <option value="1">1st Year</option>
                                        <option value="2">2nd Year</option>
                                        <option value="3">3rd Year</option>
                                        <option value="4">4th Year</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">CGPA (Scale of 10.0)</label>
                                    <input type="number" step="0.01" min="0" max="10" th:field="*{cgpa}" class="form-control" placeholder="e.g. 8.75">
                                </div>

                                <div class="col-12">
                                    <label class="form-label fw-semibold">Bio / Professional Headline</label>
                                    <textarea th:field="*{bio}" rows="3" class="form-control" placeholder="Brief summary of technical interests, engineering passion, and career goals..."></textarea>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold"><i class="fa-brands fa-github me-1"></i> GitHub Profile URL</label>
                                    <input type="url" th:field="*{githubUrl}" class="form-control" placeholder="https://github.com/username">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold"><i class="fa-brands fa-linkedin me-1 text-primary"></i> LinkedIn Profile URL</label>
                                    <input type="url" th:field="*{linkedinUrl}" class="form-control" placeholder="https://linkedin.com/in/username">
                                </div>
                            </div>

                            <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                                <a th:href="@{/students}" class="btn btn-outline-secondary">Cancel</a>
                                <button type="submit" class="btn btn-primary px-4">
                                    <i class="fa-solid fa-floppy-disk me-1"></i> Save Profile
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
